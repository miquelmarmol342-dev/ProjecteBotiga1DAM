<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
<div id="Contenedor">
    <header>
        <div class="contenedor">

                <div class="accionesusuario">

                </div>
            </div>
    </header>
    <nav>
        <ul class="menu">
            <li><a href="#" class="boton botonInicio">INICIO</a></li>
            <li><a href="#" class="boton botonProductos">PRODUCTOS</a></li>
            <li><a href="#" class="boton botonConsolas">CONSOLAS</a></li>
            <li><a href="#" class="boton botonAccesorios">ACCESORIOS</a></li>
            <li><a href="#" class="boton botonOfertas">OFERTAS</a></li>
            <li><a href="#" class="boton botonContacto">CONTACTO</a></li>
            <li><a href="#" class="boton botonCondiciones">CONDICIONES</a></li>
        </ul>
    </nav>
    <article>
        <main class="contenedorPrincipal">
            <div class="ColumnaIlustracion">
                <div class="DialogoGlobo">

                </div>
                <img src="../Imagenes/Fondoregistro.png" alt="Pirata y cofre" class="ImagenPirata">
            </div>
        <section class="formularioRegistro">
            <div class="TitulosContenedor">
                <h1 class=TituloArriba">¡ÚNETE A LA PARTIDA!</h1>
                <h1 class="TituloAbajo">REGISTRO Y ACCESO</h1>
            </div>
            <div class="SubtitulosContenedor">
            <h1 class="Subtitulo1">¡NUEVA PARTIDA!</h1>
            <h2 class="Subtitulo2">(Registrarse)</h2>
            </div>
            <div class="contenedorFormulario">
                <form action="#" method="post">
                    <div class="filaForm">
                        <label for="Nombre">Nombre de jugador / Nick</label>
                        <input type="text" id="Nombre" name="Nombre" value="">
                    </div>
                    <div class="filaForm">
                        <label for="Apellidos">Apellidos / Linaje</label>
                        <input type="text" id="Apellidos" name="Apellidos" value="">
                    </div>
                    <div class="filaForm">
                        <label for="Direccion">Dirección / Tu guarida</label>
                        <input type="text" id="Direccion" name="Direccion" value="">
                    </div>
                    <div class="filaForm">
                        <label for="Telefono">Número de contacto para alertas de incursión</label>
                        <input type="text" id="Telefono" name="Telefono" value="">
                    </div>
                    <div class="filaForm">
                        <label for="Correo">Correo Electrónico / Buzón de misiones</label>
                        <input type="text" id="Correo" name="Correo" value="">
                    </div>
                    <div class="filaForm">
                        <label for="Contraseña">Contraseña / Conjuro de acceso</label>
                        <input type="text" id="Contraseña" name="Contraseña" value="">
                    </div>
                </form>


            </div>


        </section>

        </main>


    </article>
</div>

</html>
