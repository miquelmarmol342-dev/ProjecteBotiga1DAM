<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mundo Gamer</title>
    <link rel="stylesheet" type="text/css" href="../style/CSS%20Registre%20Client.css">
    <link href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
    <link href="https://unpkg.com/nes.css@2.3.0/css/nes-core.min.css" rel="stylesheet">

</head>
<body>
<div id="Contenedor">
    <header>
        <div class="contenedor">
            <a href="#" class="link_inicio" title="Inicio"><img class="imagen" src="../Imagenes/logo.png" alt="Logo"></a>
                <form class="Buscador_div" action="" method="post">
                    <label for="Buscador"></label><input type="search" id="Buscador" name="Buscador" value="" placeholder=" 🔍 Buscar juegos, consolas y más..."/>
                </form>
                <div class="accionesusuario">
                    <a href="#" class="icon-link" title="Mi Cuenta">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                             fill="currentColor" viewBox="0 0 24 24">
                            <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
                            <path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5m0-8c1.65 0 3 1.35 3 3s-1.35 3-3 3-3-1.35-3-3 1.35-3 3-3M4 22h16c.55 0 1-.45 1-1v-1c0-3.86-3.14-7-7-7h-4c-3.86 0-7 3.14-7 7v1c0 .55.45 1 1 1m6-7h4c2.76 0 5 2.24 5 5H5c0-2.76 2.24-5 5-5"></path>
                        </svg>
                    </a>
                    <a href="#" class="icon-link" title="Favoritos">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                             fill="currentColor" viewBox="0 0 24 24">
                            <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
                            <path d="M11.29 20.66c.2.2.45.29.71.29s.51-.1.71-.29l7.5-7.5c2.35-2.35 2.35-6.05 0-8.41-2.3-2.28-5.85-2.35-8.21-.2-2.36-2.15-5.91-2.09-8.21.2-2.35 2.36-2.35 6.06 0 8.41zM5.21 6.16C6 5.38 7 4.99 8.01 4.99s2.01.39 2.79 1.17l.5.5c.39.39 1.02.39 1.41 0l.5-.5c1.56-1.56 4.02-1.56 5.59 0 1.56 1.57 1.56 4.02 0 5.58l-6.79 6.79-6.79-6.79a3.91 3.91 0 0 1 0-5.58Z"></path>
                        </svg>
                    </a>
                    <a href="#" class="icon-link" title="Carrito">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                             fill="currentColor" viewBox="0 0 24 24">
                            <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
                            <path d="M21 4H6.17l-.18-1.15A1 1 0 0 0 5 2H2v2h2.14l1.87 12.15A1 1 0 0 0 7 17h12v-2H7.86l-.31-2H19c.45 0 .84-.3.96-.73l2-7A1 1 0 0 0 21 3.99Zm-2.75 7H7.24l-.77-5h13.2l-1.43 5ZM8 18a2 2 0 1 0 0 4 2 2 0 1 0 0-4m9 0a2 2 0 1 0 0 4 2 2 0 1 0 0-4"></path>
                        </svg>
                    </a>
                </div>
            </div>
        <nav>
            <ul class="menu">
                <li><a href="#" class="boton botonInicio">INICIO</a></li>
                <li><a href="#" class="boton botonProductos">PRODUCTOS</a></li>
                <li><a href="#" class="boton botonConsolas">CONSOLAS</a></li>
                <li><a href="#" class="boton botonContacto">CONTACTO</a></li>
                <li><a href="#" class="boton botonCondiciones">CONDICIONES</a></li>
            </ul>
        </nav>
    </header>

    <article>
        <main class="contenedorPrincipal">
            <div class="ColumnaIlustracion">
                <div class="DialogoGlobo">
                    <p>¡Registrate para guardar tus logros, favoritos y conseguir ofertas exclusivas!</p>
                </div>
                <img src="../Imagenes/Fondoregistro.png" alt="Pirata y cofre" class="ImagenPirata">
            </div>
        <section class="formularioRegistro">
                    <!--Contenedor formulario-->
                    <div class="nes-container is-rounded">
                        <h3 style="color: black">¡NUEVA PARTIDA!</h3>
                        <p>(Registrarse)</p>

                        <div class="nes-field">
                            <label for="nick">Nombre de Jugador / Nick</label>
                            <input type="text" id="nick" class="nes-input" >
                        </div>

                        <div class="nes-field">
                            <label for="apellidos">Apellidos</label>
                            <input type="text" id="apellidos" class="nes-input">
                        </div>

                        <div class="nes-field">
                            <label for="direccion">Dirección</label>
                            <input type="text" id="direccion" class="nes-input" >
                        </div>

                        <div class="nes-field">
                            <label for="telefono">Teléfono</label>
                            <input type="text" id="telefono" class="nes-input" >
                        </div>

                        <div class="nes-field" style="margin-top: 15px;">
                            <label for="correo_reg">Correo Electrónico</label>
                            <input type="email" id="correo_reg" class="nes-input">
                        </div>

                        <div class="nes-field">
                            <label for="contraseña">Contraseña</label>
                            <input type="password" id="contraseña" class="nes-input" >
                        </div>

                        <!-- Radio buttons para elegir género-->
                        <div class="Genero">
                            <p>Elige tu héroe/heroína:</p>
                            <label>
                                <input type="radio" class="nes-radio" id="Link" name="clase" checked />
                                <span>Link (Hombre)</span>
                            </label>
                            <label>
                                <input type="radio" class="nes-radio" name="clase" />
                                <span>Zelda (Mujer)</span>
                            </label>
                            <label>
                                <input type="radio" class="nes-radio" name="clase" />
                                <span>Toad (Sin especificar)</span>
                            </label>
                        </div>

                        <!--Botón de confirmación de registro-->
                        <button type="button" class="nes-btn is-warning" style="width: 100%; margin-top: 20px;">
                            ¡CREAR PERFIL!
                        </button>
                    </div>
        </section>

        </main>


    </article>
</div>
</body>
</html>
